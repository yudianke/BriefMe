  # rss.cnn.com 系列是废弃 feed（条目停在 2023-2024 年），只能走 Google News
  - id: cnn
    name: CNN
    name_en: CNN
    region: world
    lang: en
    method: gnews
    query: "site:cnn.com when:1d"
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  # 周刊性质，出稿频率低。实测（13 个 feed 全量比对）：
  #   /latest 是所有板块 feed 的严格超集——24h/48h/7d 三个窗口下，
  #   把 united-states、international、finance-and-economics、china、business、
  #   britain、europe、middle-east-and-africa、science-and-technology、leaders、
  #   culture、the-world-this-week 全部并进来，独有增量都是 0 条。
  #   因此只留 /latest；多配的板块 feed 每轮白解析 900 条、多 3 次 HTTP。
  #   （另：economist.com/topics/* 那些页面没有 RSS，请求返回 403。）
  # 它 24h 内只有约 10 条，故在 models.SOURCE_WINDOW_HOURS 里单独放宽到 48h（约 17 条）。
  - id: economist
    name: 经济学人
    name_en: The Economist
    region: world
    lang: en
    method: rss
    feeds:
      - https://www.economist.com/latest/rss.xml
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  - id: nbcnews
    name: NBC News
    name_en: NBC News
    region: world
    lang: en
    method: rss
    feeds:
      - https://feeds.nbcnews.com/nbcnews/public/world
      - https://feeds.nbcnews.com/nbcnews/public/news
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  # 官方 RSS 各频道 24h 内只有个位数条目（politics-news 常滞后一天以上），
  # 走 Google News 能稳定拿到近百条真政治报道。
  - id: politico
    name: Politico
    name_en: Politico
    region: world
    lang: en
    method: gnews
    query: "site:politico.com when:1d"
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  # NHK 官方 RSS 实测已停更（最新条目在 200 小时以前），只能走 Google News。
  # 必须限定 nhkworld 英文版：site:nhk.or.jp 会把整站的节目单、剧集宣传都带进来。
  - id: nhk
    name: NHK
    name_en: NHK World
    region: world
    lang: en
    method: gnews
    query: "site:www3.nhk.or.jp/nhkworld when:1d"
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  # 共同社日文官方 RSS 里是企业公关稿（展会、促销），英文 RSS 为空，
  # 因此限定英文新闻站 english.kyodonews.net 走 Google News。
  - id: kyodo
    name: 共同社
    name_en: Kyodo News
    region: world
    lang: en
    method: gnews
    query: "site:english.kyodonews.net when:1d"
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  # 注意：正确域名是 zaobao.com.sg（zaobao.com 在 Google News 里查不到）
  - id: zaobao
    name: 联合早报
    name_en: Lianhe Zaobao
    region: world
    lang: zh
    method: scrape   # Google News 对该站抽不出标题，改为直接解析列表页

  # ---- 新增：国内 ----
  # Google News 对该站收录较慢，加 when:1d 会得到 0 条；这里不加，
  # 由 fetch 自身的 24h published_at 过滤兜底（口径一致，不会引入超窗口内容）。
  - id: cankaoxiaoxi
    name: 参考消息
    name_en: Cankao Xiaoxi
    region: china
    lang: zh
    method: scrape   # 站点为 SPA，走其公开的频道 JSON 接口

  # 无 RSS；Google News 对 site:infzm.com 只返回「关于我们」这类栏目页，
  # 故直接解析列表页 + 逐篇取文章页的 data-time。
  - id: nanfangzhoumo
    name: 南方周末
    name_en: Southern Weekly
    region: china
    lang: zh
    method: scrape
