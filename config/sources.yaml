# 新闻源注册表。method: rss | gnews (Google News RSS 兜底)
# 后续 Phase 7 会新增 method: scrape（逐站抓页面）
# gnews 用 query 字段拼 https://news.google.com/rss/search?q=<query>&hl=..&gl=..&ceid=..
sources:
  - id: bbc
    name: BBC
    region: world
    lang: en
    method: rss
    feeds:
      - http://feeds.bbci.co.uk/news/world/rss.xml
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  - id: guardian
    name: The Guardian
    region: world
    lang: en
    method: rss
    feeds:
      - https://www.theguardian.com/world/rss
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}


  - id: ap
    name: AP 美联社
    region: world
    lang: en
    method: gnews
    query: "site:apnews.com when:1d"
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  - id: reuters
    name: Reuters 路透
    region: world
    lang: en
    method: gnews
    query: "site:reuters.com when:1d"
    gnews_locale: {hl: en-US, gl: US, ceid: "US:en"}

  - id: xinhua
    name: 新华社
    region: china
    lang: zh
    method: gnews
    query: "site:news.cn when:1d"
    gnews_locale: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}

  - id: cctv
    name: 央视新闻
    region: china
    lang: zh
    method: gnews
    query: "site:news.cctv.com when:1d"
    gnews_locale: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}

  - id: caixin
    name: 财新
    region: china
    lang: zh
    method: gnews
    query: "site:caixin.com when:1d"
    gnews_locale: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}

  - id: yicai
    name: 第一财经
    region: china
    lang: zh
    method: gnews
    query: "site:yicai.com when:1d"
    gnews_locale: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}

  # ---- 新增：国际 ----
  - id: nyt
    name: 纽约时报
    region: world
    lang: en
    method: rss
    feeds:
      - https://rss.nytimes.com/services/xml/rss/nyt/World.xml
